# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

[include ../base.cfg]

[bed_mesh]
split_delta_z: 0.001 # Avoid visible surface stripe artifacts

[heater_bed]
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: Generic 3950
min_temp: 0
max_temp: 140
pwm_cycle_time: 0.103 # avoid multiples of 50hz and 60hz
                      # for better temp stability

# These are only safeguards for first time users
# Modify printer.cfg to tune acceleration.
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1500
minimum_cruise_ratio: 0.5
max_z_velocity: 15
max_z_accel: 20

[dual_carriage]
axis: x
# safe_distance includes a 2mm safety margin. Keep in sync with the value in src/templates/printers/v-core-4-1-idex-cartesian.ts
# Note: we must allow T1 to be at x=0 when T0 is parked, and likewise for T0 to be at x=500 when T1 is parked.
# We also need some headroom on top to allow for skew correction.
safe_distance: 58.85

[ratos]
enable_gcode_transform: True
