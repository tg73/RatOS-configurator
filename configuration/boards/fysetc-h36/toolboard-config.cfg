# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.
# WARNING: it is NOT recommended to override board_pins aliases, 
# use the boards pin names directly in your printer.cfg instead. 
# Look up the pins you need in the boards pinout diagram.

[board_pins fysetc-h36]
mcu: toolboard
aliases:
	# endstop
	x_endstop_pin=PB5,
	
	# TMC2209
	e_step_pin=PB9,
	e_dir_pin=PB8,
	e_enable_pin=PB7,
	e_uart_pin=PC14,
	e_diag_pin=null, 
	
	# hotend
	e_heater_pin=PA7,
	e_sensor_pin=PA6,
	
	# accel
	adxl345_cs_pin=PB12,
	adxl345_miso=PB2,
	adxl345_mosi=PB11,
	adxl345_clk=PB10,
	
	# leveling
	bltouch_sensor_pin=PB5,
	bltouch_control_pin=PB4,
	probe_pin=PB6,
	
	# fans
	fan_part_cooling_pin=PB15,
	fan_toolhead_cooling_pin=PA9
	
	# 4 pin fans
	4p_fan_part_cooling_tach_pin=PC6
	4p_fan_toolhead_cooling_tach_pin=PB14
	
	# filament sensors
	filament_sensor_runout_pin=PC7,
	filament_sensor_motion_pin=PA15,

[mcu toolboard]
serial: /dev/fysetc-h36

[adxl345 toolboard]
cs_pin: toolboard:adxl345_cs_pin
spi_software_sclk_pin: toolboard: PB10
spi_software_mosi_pin: toolboard: PB11
spi_software_miso_pin: toolboard: PB2

[temperature_sensor toolboard]
sensor_type: temperature_mcu
sensor_mcu: toolboard
